<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>示例扩展选项</title>
    <style>
      body {
        margin: 0;
        min-width: 360px;
        min-height: 220px;
        padding: 16px;
        font: 14px/1.6 system-ui, sans-serif;
        color: #1f2937;
      }
      h1 { margin: 0 0 4px; font-size: 16px; }
      p.hint { margin: 0 0 12px; font-size: 12px; color: #6b7280; }
      label { display: block; margin: 0 0 4px; font-size: 13px; font-weight: 600; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 12px;
        padding: 6px 8px;
        font: inherit;
      }
      button { padding: 8px 16px; font: inherit; cursor: pointer; }
      #status { margin: 10px 0 0; font-size: 13px; color: #15803d; }
    </style>
  </head>
  <body>
    <h1>示例扩展选项</h1>
    <p class="hint">
      这是 options_ui 声明的选项页，当前以内嵌方式显示在 chrome://extensions
      的扩展详情页里；把 manifest 的 open_in_tab 改成 true 后重载，同样的页面会
      在新标签页整页打开。设置写入 chrome.storage.sync，由 Chrome 自动同步到各设备。
    </p>
    <form id="settings">
      <label for="title">新标签页标题</label>
      <input id="title" type="text" maxlength="30" />
      <label for="theme">新标签页主题</label>
      <select id="theme">
        <option value="blue">蓝</option>
        <option value="green">绿</option>
        <option value="pink">粉</option>
      </select>
      <button type="submit">保存</button>
    </form>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
