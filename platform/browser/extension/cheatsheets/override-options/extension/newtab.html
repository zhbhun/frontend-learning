<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>我的新标签页</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 14px/1.6 system-ui, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }
      body.theme-green { background: #ecfdf3; }
      body.theme-pink { background: #fdf2f8; }
      .card {
        text-align: center;
        padding: 32px 40px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgb(15 23 42 / 12%);
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 16px; color: #6b7280; font-size: 13px; }
      button { padding: 6px 14px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">我的新标签页</h1>
      <p>
        这是 chrome_url_overrides.newtab 接管的新标签页。<br />
        标题取自选项页的设置，改动通过 chrome.storage.onChanged 实时反映到这里。
      </p>
      <button id="open-options">打开选项页</button>
    </div>
    <script src="newtab.js"></script>
  </body>
</html>
