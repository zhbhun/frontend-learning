<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 14px;
        font: 13px/1.7 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      button {
        margin: 0 8px 8px 0;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      pre {
        margin: 6px 0 0;
        padding: 8px;
        border-radius: 6px;
        background: #0f172a;
        color: #e2e8f0;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>CDP 面板</h1>
    <button id="title">读取页面标题（eval）</button>
    <button id="attach">attach 调试器</button>
    <button id="detach">detach 调试器</button>
    <pre id="output">点击按钮，结果会显示在这里。</pre>
    <script src="panel.js"></script>
  </body>
</html>
