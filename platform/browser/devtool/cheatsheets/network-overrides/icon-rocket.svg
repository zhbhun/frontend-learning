<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="火箭图标">
  <!--
    配置驱动标本的「rocket」图标资源。
    文件体积故意超过构建内联阈值（assetsInlineLimit = 4096 字节），
    保证静态构建后它仍以真实文件出现在网络上，可以被 Network 面板
    的请求阻断（Block request）拦下，用来演示「图标缺失」的降级路径。
  -->
  <defs>
    <linearGradient id="rocket-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="0.55" stop-color="#3b5fd9"/>
      <stop offset="1" stop-color="#23366f"/>
    </linearGradient>
    <linearGradient id="rocket-fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb0ff"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
    <linearGradient id="rocket-window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#b9cdfa"/>
    </linearGradient>
    <linearGradient id="rocket-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.6" stop-color="#f4845f"/>
      <stop offset="1" stop-color="#d9481f"/>
    </linearGradient>
    <linearGradient id="rocket-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1533"/>
      <stop offset="0.7" stop-color="#16295c"/>
      <stop offset="1" stop-color="#1f3a7a"/>
    </linearGradient>
    <linearGradient id="rocket-orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fb0ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8fb0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rocket-star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rocket-moon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#b9cdfa"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" rx="12" fill="url(#rocket-sky)"/>
  <g>
    <circle cx="14" cy="16" r="2.4" fill="url(#rocket-star)"/>
    <circle cx="80" cy="12" r="1.8" fill="url(#rocket-star)"/>
    <circle cx="86" cy="44" r="2.2" fill="url(#rocket-star)"/>
    <circle cx="10" cy="58" r="1.6" fill="url(#rocket-star)"/>
    <circle cx="22" cy="84" r="2.0" fill="url(#rocket-star)"/>
    <circle cx="72" cy="80" r="1.7" fill="url(#rocket-star)"/>
    <circle cx="34" cy="10" r="1.2" fill="url(#rocket-star)"/>
    <circle cx="62" cy="22" r="1.4" fill="url(#rocket-star)"/>
    <circle cx="88" cy="70" r="1.5" fill="url(#rocket-star)"/>
    <circle cx="8" cy="34" r="1.3" fill="url(#rocket-star)"/>
    <circle cx="46" cy="6" r="1.1" fill="url(#rocket-star)"/>
    <circle cx="78" cy="30" r="1.2" fill="url(#rocket-star)"/>
  </g>
  <path d="M4 52c14-6 26-6 40 0 14 6 26 6 40 0" fill="none"
        stroke="url(#rocket-orbit)" stroke-width="1.2" stroke-dasharray="3 4"/>
  <circle cx="80" cy="20" r="7" fill="url(#rocket-moon)"/>
  <circle cx="77.5" cy="17.5" r="1.8" fill="#dfe8ff" opacity="0.8"/>
  <circle cx="82.5" cy="22.5" r="1.2" fill="#dfe8ff" opacity="0.7"/>
  <g>
    <path d="M48 8c9 7 14 18 14 30 0 8-2 15-6 21H40c-4-6-6-13-6-21 0-12 5-23 14-30z"
          fill="url(#rocket-body)" stroke="#1c2b57" stroke-width="1.5"/>
    <path d="M40 46 28 66c-1 2 1 4 3 3l14-8z" fill="url(#rocket-fin)" stroke="#1c2b57" stroke-width="1.2"/>
    <path d="M56 46l12 20c1 2-1 4-3 3l-14-8z" fill="url(#rocket-fin)" stroke="#1c2b57" stroke-width="1.2"/>
    <circle cx="48" cy="34" r="8.5" fill="url(#rocket-window)" stroke="#1c2b57" stroke-width="1.5"/>
    <circle cx="45.5" cy="31.5" r="2.6" fill="#ffffff" opacity="0.85"/>
    <path d="M42 60h12l-2 6H44z" fill="#23366f"/>
    <path d="M43 68c1 6-1 10-5 14 5-1 8-3 10-6 2 3 5 5 10 6-4-4-6-8-5-14z"
          fill="url(#rocket-flame)"/>
    <path d="M46 68h4l-1 9h-2z" fill="#fff3c4" opacity="0.9"/>
  </g>
  <path d="M18 92h60" stroke="#3b5fd9" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M26 92c2-4 6-6 10-6M70 92c-2-4-6-6-10-6" fill="none"
        stroke="#3b5fd9" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
</svg>
