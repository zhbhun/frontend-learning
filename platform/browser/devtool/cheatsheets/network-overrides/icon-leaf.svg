<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="叶片图标">
  <!--
    配置驱动标本的「leaf」图标资源。
    文件体积故意超过构建内联阈值（assetsInlineLimit = 4096 字节），
    保证静态构建后它仍以真实文件出现在网络上，可以被 Network 面板
    的请求阻断（Block request）拦下，用来演示「图标缺失」的降级路径。
  -->
  <defs>
    <linearGradient id="leaf-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#0f9d6c"/>
      <stop offset="1" stop-color="#0a5c43"/>
    </linearGradient>
    <linearGradient id="leaf-vein" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7fff4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="leaf-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a5c43"/>
      <stop offset="1" stop-color="#06402f"/>
    </linearGradient>
    <linearGradient id="leaf-ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f9d6c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0f9d6c" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0f9d6c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06281e"/>
      <stop offset="0.7" stop-color="#0a3d2c"/>
      <stop offset="1" stop-color="#0e5540"/>
    </linearGradient>
    <radialGradient id="leaf-dew" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </radialGradient>
    <radialGradient id="leaf-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d1fae5" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d1fae5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" rx="12" fill="url(#leaf-sky)"/>
  <circle cx="78" cy="16" r="12" fill="url(#leaf-sun)"/>
  <g>
    <circle cx="76" cy="18" r="9" fill="url(#leaf-glow)"/>
    <circle cx="16" cy="72" r="7" fill="url(#leaf-glow)"/>
    <circle cx="20" cy="14" r="1.4" fill="url(#leaf-glow)"/>
    <circle cx="86" cy="52" r="1.6" fill="url(#leaf-glow)"/>
    <circle cx="10" cy="42" r="1.2" fill="url(#leaf-glow)"/>
    <circle cx="60" cy="8" r="1.3" fill="url(#leaf-glow)"/>
    <circle cx="30" cy="88" r="1.5" fill="url(#leaf-glow)"/>
    <circle cx="84" cy="86" r="1.2" fill="url(#leaf-glow)"/>
  </g>
  <path d="M48 10c22 10 34 30 30 52-3 16-16 26-30 24-14 2-27-8-30-24C14 40 26 20 48 10z"
        fill="url(#leaf-main)" stroke="#06402f" stroke-width="1.6"/>
  <path d="M48 16v64" stroke="url(#leaf-vein)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M48 28c-8 2-14 7-17 14M48 28c8 2 14 7 17 14M48 44c-7 2-12 6-15 12M48 44c7 2 12 6 15 12M48 60c-5 2-9 5-11 9M48 60c5 2 9 5 11 9"
        fill="none" stroke="url(#leaf-vein)" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="40" cy="34" rx="6.5" ry="4" transform="rotate(-24 40 34)" fill="url(#leaf-dew)" opacity="0.75"/>
  <path d="M48 78c-2 6-6 10-12 12 7 1 12-1 15-5z" fill="url(#leaf-stem)"/>
  <path d="M12 92h72" stroke="url(#leaf-ground)" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 92c3-5 8-7 13-6M72 92c-3-5-8-7-13-6" fill="none"
        stroke="#34d399" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
  <g opacity="0.5" stroke="#a7f3d0" stroke-width="1.1" stroke-linecap="round">
    <path d="M14 26c3-2 6-2 9 0M12 31c4-2 8-2 12 0M70 62c3-2 6-2 9 0M66 68c4-2 8-2 12 0M22 78c3-2 5-2 8 0"/>
  </g>
  <circle cx="58" cy="70" r="2.2" fill="url(#leaf-dew)" opacity="0.6"/>
  <circle cx="64" cy="58" r="1.6" fill="url(#leaf-dew)" opacity="0.5"/>
  <g opacity="0.45" fill="#d1fae5">
    <circle cx="8" cy="14" r="1.1"/>
    <circle cx="90" cy="34" r="1.2"/>
    <circle cx="6" cy="60" r="1.0"/>
    <circle cx="42" cy="90" r="1.1"/>
    <circle cx="88" cy="76" r="1.0"/>
    <circle cx="34" cy="6" r="1.0"/>
  </g>
  <path d="M18 8c2 3 2 6 0 9M78 86c-2 3-2 6 0 9" fill="none"
        stroke="#a7f3d0" stroke-width="1.0" stroke-linecap="round" opacity="0.4"/>
</svg>
