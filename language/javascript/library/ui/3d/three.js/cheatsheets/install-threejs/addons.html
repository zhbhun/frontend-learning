<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <title>Three.js Addons 验证</title>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="lesson-card">
      <section class="lesson-copy">
        <h1>Addons 验证</h1>
        <p>OrbitControls 来自已安装的 three 包，不需要第二次安装。</p>

        <dl class="status-grid">
          <div>
            <dt>核心入口</dt>
            <dd>three</dd>
          </div>
          <div>
            <dt>Addon 入口</dt>
            <dd>three/addons/</dd>
          </div>
          <div>
            <dt>THREE.REVISION</dt>
            <dd data-revision>检查中</dd>
          </div>
        </dl>

        <ul class="checks" data-checks aria-live="polite"></ul>
      </section>

      <div class="renderer-stage" data-renderer-stage aria-label="Addons 页面清屏结果"></div>
    </main>

    <script type="module" src="./addons.js"></script>
