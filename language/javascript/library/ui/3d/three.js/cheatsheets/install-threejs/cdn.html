<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <title>Three.js CDN 验证</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="lesson-card">
      <section class="lesson-copy">
        <h1>CDN 验证</h1>
        <p>核心模块和 Addons 固定到同一个 CDN、同一个 three 版本。</p>

        <dl class="status-grid">
          <div>
            <dt>加载来源</dt>
            <dd>cdn.jsdelivr.net</dd>
          </div>
          <div>
            <dt>固定版本</dt>
            <dd>0.185.1</dd>
          </div>
          <div>
            <dt>THREE.REVISION</dt>
            <dd data-revision>检查中</dd>
          </div>
        </dl>

        <ul class="checks" data-checks aria-live="polite"></ul>
      </section>

      <div class="renderer-stage" data-renderer-stage aria-label="CDN 页面清屏结果"></div>
    </main>

    <script type="module" src="./cdn.js"></script>
  </body>
</html>
