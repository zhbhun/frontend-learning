<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <title>Three.js 本地包验证</title>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="lesson-card">
      <section class="lesson-copy">
        <h1>本地包验证</h1>
        <p>import map 把浏览器中的模块名映射到已安装的 three 包。</p>

        <dl class="status-grid">
          <div>
            <dt>加载来源</dt>
            <dd>node_modules</dd>
          </div>
          <div>
            <dt>THREE.REVISION</dt>
            <dd data-revision>检查中</dd>
          </div>
          <div>
            <dt>渲染后端</dt>
            <dd>WebGL 2</dd>
          </div>
        </dl>

        <ul class="checks" data-checks aria-live="polite"></ul>
      </section>

      <div class="renderer-stage" data-renderer-stage aria-label="WebGL 清屏结果"></div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
