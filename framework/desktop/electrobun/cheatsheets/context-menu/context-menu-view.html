<!--
  演示内容：右键联动的视图页——data-context 属性标记右键区域（输入框 / 列表行），
  context-menu-view.ts 给这些区域挂 contextmenu 处理并应用菜单动作。
  输入 / 前置：放到 src/mainview/index.html；context-menu-view.ts 放到
  src/mainview/index.ts（electrobun.config.ts 的 views 构建入口），本页底部
  用 <script src="views://mainview/index.js"> 引用构建产物，与 hello-world
  工程相同。
  操作：右键输入框、列表项、页面空白处。
  预期结果：输入框弹 剪切/拷贝/粘贴/插入日期（role 项原生编辑输入框）；
  列表项弹 置顶/删除/清空列表，点击后列表变化；空白处右键不弹本课菜单。
  阅读主线：HTML 只负责标记与展示；右键上报与动作应用都在 context-menu-view.ts。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>上下文菜单</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font: 13px/1.6 system-ui, sans-serif;
			background: #1e2430;
			color: #e6e9f0;
			padding: 20px;
		}
		h1 { font-size: 16px; margin-bottom: 14px; }
		.field {
			display: block;
			margin-bottom: 16px;
		}
		.field input {
			width: 100%;
			margin-top: 4px;
			padding: 8px 10px;
			font: inherit;
			color: #e6e9f0;
			background: #141925;
			border: 1px solid #3b465c;
			border-radius: 6px;
		}
		#list { list-style: none; }
		#list li {
			padding: 8px 12px;
			margin-bottom: 6px;
			background: #141925;
			border: 1px solid #3b465c;
			border-radius: 6px;
			cursor: default;
		}
		.hint { margin-top: 16px; color: #9aa5b8; font-size: 12px; }
	</style>
</head>
<body>
	<h1>便签</h1>
	<!-- data-context 是右键目标标识：主进程按它决定菜单内容 -->
	<label class="field">
		搜索
		<input id="search" value="electrobun 桌面开发" data-context="search" />
	</label>
	<ul id="list">
		<li data-context="list-item:0">买牛奶</li>
		<li data-context="list-item:1">写周报</li>
		<li data-context="list-item:2">还书</li>
	</ul>
	<p class="hint">右键输入框或列表项弹菜单；页面空白处不弹本课菜单。</p>
	<!-- 视图脚本产物：build.views.mainview 把 index.ts 转译为 views://mainview/index.js -->
	<script src="views://mainview/index.js"></script>
</body>
</html>
