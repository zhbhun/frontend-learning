<!--
  演示内容：自绘标题栏的视图页——拖拽标记（drag class）、no-drag 排除与窗口控件按钮。
  输入 / 前置：放到 src/mainview/index.html；titlebar-view.ts 放到 src/mainview/index.ts
  （electrobun.config.ts 的 views.mainview.entrypoint，构建后自动注入本页，
  HTML 不需要手写 script 引用，与 hello-world 工程相同）。
  操作：打开窗口后按住标题栏拖动、点击三个圆点按钮。
  预期结果：标题栏空白与标题文字都能拖动窗口；按钮点击生效且不会触发拖拽。
  阅读主线：drag class 挂整条标题栏（子元素自动可拖），no-drag 只包住控件容器。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>自绘标题栏</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font: 13px/1.6 system-ui, sans-serif;
			background: #1e2430;
			color: #e6e9f0;
		}
		/* 整条标题栏是拖拽区域：class 写在 class 属性里，样式表只管外观 */
		.titlebar {
			display: flex;
			align-items: center;
			height: 36px;
			padding: 0 14px;
			background: #141925;
			/* 拖拽机制不阻止文本选中：拖动时不选标题文字要自己关 */
			user-select: none;
		}
		/* 只包住交互控件：命中判定先走 no-drag，一票否决 */
		.window-controls {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-left: auto;
		}
		.window-controls button {
			width: 12px;
			height: 12px;
			border: none;
			border-radius: 50%;
			cursor: pointer;
		}
		.close-btn { background: #ff5f57; }
		.minimize-btn { background: #febc2e; }
		.maximize-btn { background: #28c840; }
		.content { padding: 16px; }
		.content p { margin-bottom: 8px; }
	</style>
</head>
<body>
	<!-- drag class 挂标题栏容器；子元素（标题文字）按下同样命中 -->
	<div class="titlebar electrobun-webkit-app-region-drag">
		<span class="title">按住这里拖动窗口</span>
		<!-- no-drag 包住整组控件：按钮可点击，也不会触发窗口移动 -->
		<div class="window-controls electrobun-webkit-app-region-no-drag">
			<button class="close-btn" id="closeBtn" title="关闭"></button>
			<button class="minimize-btn" id="minimizeBtn" title="最小化"></button>
			<button class="maximize-btn" id="maximizeBtn" title="最大化 / 还原"></button>
		</div>
	</div>
	<div class="content">
		<p>标题栏空白、标题文字：可拖拽窗口。</p>
		<p>三个圆点按钮：点击生效，且按住拖动不会移动窗口。</p>
		<p>内容区：无标记，怎么拖都不动。</p>
	</div>
</body>
</html>
