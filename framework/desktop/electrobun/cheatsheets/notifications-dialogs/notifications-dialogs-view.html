<!--
  演示内容：通知与对话框联动的视图页——草稿行的「删除」按钮触发 rpc.request
  （等按钮索引），「模拟下载完成」按钮触发 rpc.send（不等结果）；
  notifications-dialogs-view.ts 负责接线与生效。
  输入 / 前置：放到 src/mainview/index.html；notifications-dialogs-view.ts 放到
  src/mainview/index.ts（electrobun.config.ts 的 views 构建入口，构建后自动注入
  本页，HTML 不需要手写 script 引用，与 hello-world 工程相同）。
  操作：点草稿行「删除」后在原生对话框里点「删除 / 取消」或按 Esc；点「模拟下载完成」。
  预期结果：「删除」移除该行、「取消」/ Esc 不动；「模拟下载完成」系统弹通知横幅、
  状态行更新；对话框未关闭时页面按钮点不动（模态）。
  阅读主线：HTML 只负责展示与 data-delete 标识；两条路径的发出与生效都在 view.ts。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>通知与对话框</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font: 13px/1.6 system-ui, sans-serif;
			background: #1e2430;
			color: #e6e9f0;
			padding: 20px;
		}
		h1 { font-size: 16px; margin-bottom: 14px; }
		button {
			font: inherit;
			color: #e6e9f0;
			background: #2a3346;
			border: 1px solid #3b465c;
			border-radius: 6px;
			padding: 6px 14px;
			cursor: pointer;
		}
		button:hover { background: #354057; }
		#status { margin: 10px 0 18px; color: #9aa5b8; font-size: 12px; }
		#drafts { list-style: none; }
		#drafts li {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 8px 12px;
			margin-bottom: 6px;
			background: #141925;
			border: 1px solid #3b465c;
			border-radius: 6px;
		}
		.hint { margin-top: 16px; color: #9aa5b8; font-size: 12px; }
	</style>
</head>
<body>
	<h1>下载器</h1>
	<button id="simulate">模拟下载完成（rpc.send）</button>
	<p id="status">状态：空闲</p>
	<ul id="drafts">
		<!-- data-delete 是删除目标标识：主进程把它写进对话框文案，response 回来后再删 -->
		<li>接口草稿 <button data-delete="接口草稿">删除</button></li>
		<li>发布说明 <button data-delete="发布说明">删除</button></li>
		<li>性能笔记 <button data-delete="性能笔记">删除</button></li>
	</ul>
	<p class="hint">「删除」经 rpc.request 弹主进程的原生对话框；「模拟下载完成」经 rpc.send 弹系统通知。</p>
</body>
</html>
