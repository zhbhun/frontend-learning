<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webview 标签观察台</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
      header { padding: 10px 14px 6px; }
      header h1 { font-size: 15px; margin: 0 0 2px; }
      header p { font-size: 12px; margin: 0; opacity: .7; }
      section { padding: 0 14px 10px; }
      h2 { font-size: 13px; margin: 8px 0 6px; }
      .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
      button { font-size: 12px; padding: 4px 10px; }
      .pill { font-size: 11px; opacity: .65; }
      /* 覆盖标签内置的 800x300 默认样式（内置样式注入在 head 最前，可被页面样式覆盖） */
      electrobun-webview { width: 100%; height: 260px; }
      #log { height: 180px; overflow: auto; border: 1px solid rgba(127,127,127,.45);
             border-radius: 8px; padding: 8px 10px;
             font: 11px/1.7 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
<header>
  <h1>webview 标签观察台</h1>
  <p>上方外站标签（sandbox + 导航白名单），下方本地 views 子页（preload → host-message）。事件同时打进本页面板与启动终端。</p>
</header>

<section>
  <h2>外站子 webview（sandbox）</h2>
  <div class="bar">
    <button data-act="reload">reload</button>
    <button data-act="back">goBack</button>
    <button data-act="forward">goForward</button>
    <button data-act="transparent">toggleTransparent</button>
    <button data-act="passthrough">togglePassthrough</button>
    <span class="pill" id="remote-state"></span>
  </div>
  <electrobun-webview class="remote" src="https://electrobun.dev" sandbox></electrobun-webview>
</section>

<section>
  <h2>本地子 webview（views:// + preload）</h2>
  <electrobun-webview class="child" src="views://childview/index.html"
      preload="views://childview/child-preload.js"></electrobun-webview>
</section>

<section>
  <h2>事件日志（宿主页面 tag.on）</h2>
  <div id="log"></div>
</section>

<script type="module" src="index.js"></script>
</body>
</html>
