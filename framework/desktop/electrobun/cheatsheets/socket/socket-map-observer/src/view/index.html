<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<title>socketMap 观察台</title>
	<style>
		body {
			margin: 0;
			background: #f8fafc;
			color: #172033;
			font-family: system-ui, -apple-system, sans-serif;
			padding: 20px 24px;
		}
		h1 { font-size: 18px; margin: 0 0 4px; }
		p.hint { color: #475569; font-size: 13px; margin: 0 0 14px; }
		.globals {
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 12px;
			background: #eef2ff;
			border: 1px solid #c7d2fe;
			border-radius: 8px;
			padding: 10px 12px;
			margin: 0 0 14px;
			white-space: pre-wrap;
			word-break: break-all;
		}
		button {
			font: inherit;
			padding: 6px 14px;
			border-radius: 8px;
			border: 1px solid #4f7cff;
			background: #4f7cff;
			color: #fff;
			cursor: pointer;
			margin-right: 8px;
		}
		button.warn { border-color: #b45309; background: #b45309; }
		button:active { opacity: 0.85; }
		#log {
			margin-top: 14px;
			font-size: 13px;
			line-height: 1.8;
		}
		#log div { border-bottom: 1px dashed #e2e8f0; padding: 2px 0; }
		#log code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
	</style>
</head>
<body>
	<h1>socketMap 观察台</h1>
	<p class="hint">
		视图侧连接 socket 的前提是构造 Electroview（下方脚本顶层已构造）；
		每次重载页面都会新建一条连接、在主进程登记表里覆盖同 id 条目。
	</p>
	<div class="globals" id="globals">（等待读取全局属性…）</div>
	<button id="ping">rpc.request.ping()</button>
	<button id="reload" class="warn">重载页面（观察 close → open）</button>
	<div id="log"></div>
	<script type="module" src="index.js"></script>
</body>
</html>
