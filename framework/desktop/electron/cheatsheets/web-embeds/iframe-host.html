<!--
  范例介绍：在宿主页面里用 iframe 嵌入第三方页面，演示页面侧能看见与看不见的边界。
  操作：把 src 换成允许嵌入的站点与拒绝嵌入的站点（返回 X-Frame-Options / CSP frame-ancestors）各试一次。
  预期：允许时正常显示；拒绝时区域空白，但本页的 load 事件照常触发——
        页面侧判断不了"被拒"，可靠信号只在主进程的 did-fail-load（isMainFrame 为 false，-27）。
  阅读主线：同源策略只约束"页面 JS 之间"；跨源 iframe 显示得出来，但宿主 JS 读不进去。
-->
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>iframe 宿主页面</title>
  </head>
  <body>
    <h1>宿主页面</h1>
    <p>嵌入区下方这行字与 iframe 互不知晓——它们只是同一个 webContents 里的两个 frame。</p>
    <iframe
      id="embed"
      src="https://www.electronjs.org"
      style="width: 100%; height: 320px; border: 1px solid #cbd5e1"
    ></iframe>

    <script>
      const embed = document.querySelector('#embed');

      // 无论内容是否真的显示出来，load 都会触发（被拒时 frame 里加载的是错误页）
      embed.addEventListener('load', () => {
        console.log('iframe 触发了 load——凭它判断不了对方是否拒绝被嵌');
      });

      // 同源策略：跨源 iframe 的内部世界对本页 JS 完全不透明
      function tryReadInside() {
        // 跨源时 contentDocument 就是 null（同源时才能读到）：
        // console.log(embed.contentDocument);
        // 跨源时访问 contentWindow.location 会直接抛错：
        // console.log(embed.contentWindow.location.href);
      }
      tryReadInside();
    </script>
  </body>
</html>
