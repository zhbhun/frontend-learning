# 范例：GitHub Actions 三平台矩阵构建骨架。
#
# 演示内容：jobs 用 strategy.matrix 按平台拆成三个 job，每台 runner 上 `npm run make`
# 只产出宿主平台支持的安装包，产物统一上传为 CI 产物。
# 前置状态：仓库根目录的 forge.config.mts 已配齐三平台 makers（见本目录 forge.config.mts）。
# 预期结果：Actions 页面出现 macos / ubuntu / windows 三个 job，
# Summary 区可下载 dist-macOS / dist-Linux / dist-Windows 三组产物。
# 阅读主线：strategy.matrix 定义三个 runner → 共用同一组步骤 → upload-artifact 按 runner.os 命名。

name: build

on:
  push:
    tags:
      - 'v*' # 打 tag 时构建；tag 到 GitHub Releases 的自动发布见「发布流程」课程
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  make:
    strategy:
      # 一个平台失败不连坐其他平台，三份日志各自独立排查
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      # Linux runner 补齐 rpm 工具链（deb 所需的 dpkg 与 fakeroot 通常已预装）
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # makers 配齐后无需任何按平台分支的脚本：每台 runner 自然只产宿主支持的格式
      - run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          # v4 不允许同名 artifact 并存，name 必须带矩阵变量区分
          name: dist-${{ runner.os }}
          path: out/make
