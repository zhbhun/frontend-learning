# 范例：tag 触发的三平台发布工作流。
#
# 演示内容：推 v* tag 触发三台 runner 矩阵构建，每台 runner 用 electron-forge publish
#           级联 package → make，把宿主产物上传到同一个 GitHub Release。
# 前置状态：仓库根目录的 forge.config.mts 已配置 publisher-github（见本目录 forge.config.mts）；
#           GITHUB_TOKEN 在 Actions 中自动可用，workflow 需声明 contents: write 权限。
# 预期结果：Releases 页出现 tagPrefix + version 命名的 Release（draft: true 时先为草稿），
#           挂着 macOS zip/dmg、Windows Setup.exe + full.nupkg + RELEASES、Linux deb/rpm。
# 阅读主线：on.push.tags 是唯一发布开关 → 矩阵三平台 → publish 级联上传。
#           与「多平台构建」课程的 build.yml 分工：build 面向日常构建产物（Actions artifacts），
#           release 面向正式发布（产物直达 Releases）。

name: release

on:
  push:
    tags:
      - 'v*' # 唯一发布开关：只有打 tag 才发版，主分支推送不会误发

permissions:
  contents: write # publisher 用 GITHUB_TOKEN 创建 Release 与上传产物（8.4 课程已讲）

jobs:
  publish:
    strategy:
      # 一个平台失败不连坐其他平台；失败平台的产物缺席就是发布清单的"不齐全"
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      # Linux runner 补齐 rpm 工具链（deb 所需的 dpkg 与 fakeroot 通常已预装，见 8.2）
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # 级联 package → make → 上传。publishers 默认发布所有平台产物：
      # 三台 runner 按 tagPrefix + version 算出同一个 Release，各自上传宿主产物
      - run: npx electron-forge publish
