<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>y-prosemirror smoke</title>
    <style>
      .editor-wrap { display: flex; gap: 16px; }
      .editor-box { border: 1px solid #ccc; min-height: 80px; width: 320px; padding: 4px; }
      .ProseMirror { outline: none; min-height: 60px; }
      .ProseMirror-yjs-cursor {
        position: relative;
        margin-left: -1px;
        margin-right: -1px;
        border-left: 1px solid black;
        border-right: 1px solid black;
        word-break: normal;
        pointer-events: none;
      }
      .ProseMirror-yjs-cursor > div {
        position: absolute;
        top: -1.05em;
        left: -1px;
        font-size: 13px;
        color: white;
        padding-left: 2px;
        padding-right: 2px;
        white-space: nowrap;
      }
      .collaboration-carets__caret { position: relative; border-left: 1px solid; }
      .collaboration-carets__label { position: absolute; top: -1.05em; left: -1px; font-size: 12px; color: #fff; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="editor-wrap">
      <div>
        <p>A</p>
        <div id="editor-a" class="editor-box"></div>
      </div>
      <div>
        <p>B</p>
        <div id="editor-b" class="editor-box"></div>
      </div>
    </div>
    <div id="tiptap-c" class="editor-box" style="margin-top:16px"></div>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
